name: onclave

services:
  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?}
      RABBITMQ_DEFAULT_VHOST: onclave
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  postgres:
    image: ${POSTGRES_IMAGE:?}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-menos}
      POSTGRES_USER: ${POSTGRES_USER:-menos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    configs:
      - source: vault-schema
        target: /docker-entrypoint-initdb.d/20260721-000000_initial_schema.sql
        mode: 0444
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  minio:
    image: ${MINIO_IMAGE:?}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  ollama:
    image: ${OLLAMA_IMAGE:?}
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  searxng:
    image: ${SEARXNG_IMAGE:?}
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?}
      GRANIAN_HOST: 0.0.0.0
    ports:
      - "8888:8080"

  docling-serve:
    image: ${DOCLING_IMAGE:?}
    restart: unless-stopped
    environment:
      DOCLING_SERVE_ENABLE_UI: "0"
    ports:
      - "5001:5001"

  onclave-core:
    image: ${ONCLAVE_CORE_IMAGE_REPOSITORY:?}:${ONCLAVE_CORE_IMAGE_TAG:?}@${ONCLAVE_CORE_IMAGE_DIGEST:?}
    restart: unless-stopped
    environment:
      ONCLAVE_AMQP_URL: amqp://${RABBITMQ_DEFAULT_USER:?}:${RABBITMQ_DEFAULT_PASS:?}@rabbitmq:5672/onclave
      ONCLAVE_HTTP_PORT: "8000"
      ONCLAVE_QUEUE_TTL_MS: ${ONCLAVE_QUEUE_TTL_MS:-604800000}
      ONCLAVE_QUEUE_MAX_LENGTH: ${ONCLAVE_QUEUE_MAX_LENGTH:-1000}
      ONCLAVE_HEARTBEAT_STALE_MS: ${ONCLAVE_HEARTBEAT_STALE_MS:-90000}
      ONCLAVE_MAX_EXCHANGES: ${ONCLAVE_MAX_EXCHANGES:-16}
      ONCLAVE_MAX_TOTAL_TOKENS: ${ONCLAVE_MAX_TOTAL_TOKENS:-200000}
      ONCLAVE_VAULT_API_BASE_URL: ${ONCLAVE_VAULT_API_BASE_URL:-http://localhost:8000}
      ONCLAVE_VAULT_POSTGRES_HOST: postgres
      ONCLAVE_VAULT_POSTGRES_PORT: "5432"
      ONCLAVE_VAULT_POSTGRES_USER: ${POSTGRES_USER:-menos}
      ONCLAVE_VAULT_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      ONCLAVE_VAULT_POSTGRES_DATABASE: ${POSTGRES_DATABASE:-menos}
      ONCLAVE_VAULT_POSTGRES_POOL_MIN_SIZE: ${ONCLAVE_VAULT_POSTGRES_POOL_MIN_SIZE:-1}
      ONCLAVE_VAULT_POSTGRES_POOL_MAX_SIZE: ${ONCLAVE_VAULT_POSTGRES_POOL_MAX_SIZE:-10}
      ONCLAVE_VAULT_S3_ENDPOINT_URL: minio:9000
      ONCLAVE_VAULT_S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      ONCLAVE_VAULT_S3_SECRET_KEY: ${S3_SECRET_KEY:?}
      ONCLAVE_VAULT_S3_SECURE: ${ONCLAVE_VAULT_S3_SECURE:-false}
      ONCLAVE_VAULT_S3_BUCKET: ${ONCLAVE_VAULT_S3_BUCKET:-menos}
      ONCLAVE_VAULT_S3_REGION: ${ONCLAVE_VAULT_S3_REGION:-us-east-1}
      ONCLAVE_VAULT_OLLAMA_URL: http://ollama:11434
      ONCLAVE_VAULT_OLLAMA_MODEL: ${ONCLAVE_VAULT_OLLAMA_MODEL:-mxbai-embed-large}
      ONCLAVE_VAULT_DOCLING_URL: http://docling-serve:5001
      ONCLAVE_VAULT_SSH_PUBLIC_KEYS_PATH: /keys/authorized_keys
      ONCLAVE_VAULT_WEBSHARE_PROXY_USERNAME: ${WEBSHARE_PROXY_USERNAME:?}
      ONCLAVE_VAULT_WEBSHARE_PROXY_PASSWORD: ${WEBSHARE_PROXY_PASSWORD:?}
      ONCLAVE_VAULT_YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      ONCLAVE_VAULT_AGENT_EXPANSION_PROVIDER: ${ONCLAVE_VAULT_AGENT_EXPANSION_PROVIDER:-openrouter}
      ONCLAVE_VAULT_AGENT_EXPANSION_MODEL: ${ONCLAVE_VAULT_AGENT_EXPANSION_MODEL:-}
      ONCLAVE_VAULT_AGENT_RERANK_PROVIDER: ${ONCLAVE_VAULT_AGENT_RERANK_PROVIDER:-none}
      ONCLAVE_VAULT_AGENT_RERANK_MODEL: ${ONCLAVE_VAULT_AGENT_RERANK_MODEL:-cross-encoder/ms-marco-MiniLM-L-12-v2}
      ONCLAVE_VAULT_AGENT_SYNTHESIS_PROVIDER: ${ONCLAVE_VAULT_AGENT_SYNTHESIS_PROVIDER:-openrouter}
      ONCLAVE_VAULT_AGENT_SYNTHESIS_MODEL: ${ONCLAVE_VAULT_AGENT_SYNTHESIS_MODEL:-}
      ONCLAVE_VAULT_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ONCLAVE_VAULT_ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ONCLAVE_VAULT_OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ONCLAVE_VAULT_UNIFIED_PIPELINE_ENABLED: ${ONCLAVE_VAULT_UNIFIED_PIPELINE_ENABLED:-true}
      ONCLAVE_VAULT_UNIFIED_PIPELINE_PROVIDER: ${ONCLAVE_VAULT_UNIFIED_PIPELINE_PROVIDER:-openrouter}
      ONCLAVE_VAULT_UNIFIED_PIPELINE_MODEL: ${ONCLAVE_VAULT_UNIFIED_PIPELINE_MODEL:-}
      ONCLAVE_VAULT_UNIFIED_PIPELINE_MAX_CONCURRENCY: ${ONCLAVE_VAULT_UNIFIED_PIPELINE_MAX_CONCURRENCY:-4}
      ONCLAVE_VAULT_UNIFIED_PIPELINE_MAX_NEW_TAGS: ${ONCLAVE_VAULT_UNIFIED_PIPELINE_MAX_NEW_TAGS:-3}
      ONCLAVE_VAULT_CALLBACK_URL: ${CALLBACK_URL:-}
      ONCLAVE_VAULT_CALLBACK_SECRET: ${CALLBACK_SECRET:-}
      ONCLAVE_VAULT_SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
      ONCLAVE_VAULT_ENTITY_MAX_TOPICS_PER_CONTENT: ${ONCLAVE_VAULT_ENTITY_MAX_TOPICS_PER_CONTENT:-7}
      ONCLAVE_VAULT_ENTITY_MIN_CONFIDENCE: ${ONCLAVE_VAULT_ENTITY_MIN_CONFIDENCE:-0.6}
      ONCLAVE_VAULT_ENTITY_FETCH_EXTERNAL_METADATA: ${ONCLAVE_VAULT_ENTITY_FETCH_EXTERNAL_METADATA:-true}
    ports:
      - "8000:8000"
    volumes:
      - onclave-data:/data
    configs:
      - source: authorized_keys
        target: /keys/authorized_keys
        mode: 0444
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      ollama:
        condition: service_started
      searxng:
        condition: service_started
      docling-serve:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

configs:
  authorized_keys:
    file: ${ONCLAVE_AUTHORIZED_KEYS_FILE:?}
  vault-schema:
    file: ./vault-schema.sql

volumes:
  rabbitmq-data:
  onclave-data:
  postgres-data:
  minio-data:
  ollama-data:
